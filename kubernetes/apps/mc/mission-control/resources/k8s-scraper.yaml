apiVersion: configs.flanksource.com/v1
kind: ScrapeConfig
metadata:
  name: homelab
  namespace: mc
spec:
  retention:
    changes:
      - name: PodCrashLooping
        count: 20
        age: 72h
  kubernetes:
    - clusterName: homelab
      exclusions:
        kind:
          - Secret
          - APIService
          - PodMetrics
          - NodeMetrics
          - endpoints.discovery.k8s.io
          - endpointslices.discovery.k8s.io
          - leases.coordination.k8s.io
          - podmetrics.metrics.k8s.io
          - nodemetrics.metrics.k8s.io
          - customresourcedefinition
          - componentstatuses
          - controllerrevisions
          - certificaterequests
          - orders.acme.cert-manager.io
        labels:
          app.kubernetes.io/instance: mission-control-mission-control-beta-mission-control-tenant
          canaries.flanksource.com/check: '*'
          canaries.flanksource.com/check-id: '*'
          canaries.flanksource.com/generated: 'true'
          canary-checker.flanksource.com/check: '*'
          canary-checker.flanksource.com/generated: '*'
      transform:
        changes:
          mapping:
            # restartCount bumps arrive as 'diff' changes on status.containerStatuses;
            # rename them so the timeline reads "PodCrashLooping"
            - filter: >
                change_type == 'diff' && summary == "status.containerStatuses" &&
                patch != null && has(patch.status) && has(patch.status.containerStatuses) &&
                patch.status.containerStatuses.size() > 0 &&
                has(patch.status.containerStatuses[0].restartCount)
              type: PodCrashLooping
        relationship:
          # Deployment → GitHub repository (cross-scraper, via annotation).
          # Annotation value is "github/adityathebe/mc-demo"; the repo config item
          # is named "adityathebe/mc-demo", so strip the prefix.
          - filter: >
              config_type == "Kubernetes::Deployment" &&
              has(config.metadata.annotations) &&
              "config.flanksource.com/repository" in config.metadata.annotations
            type:
              value: GitHub::Repository
            name:
              expr: config.metadata.annotations["config.flanksource.com/repository"].replace("github/", "")
            scope:
              value: all
          # Deployment → its database (static; the deployment carries no db annotation)
          - filter: config_type == "Kubernetes::Deployment" && name == "mc-demo-app"
            type:
              value: Postgres::Database
            name:
              value: demoapp
            scope:
              value: all
