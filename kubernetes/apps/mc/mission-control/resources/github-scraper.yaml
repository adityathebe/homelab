apiVersion: configs.flanksource.com/v1
kind: ScrapeConfig
metadata:
  name: adityathebe-github
  namespace: mc
spec:
  schedule: '@every 5m'
  github:
    - personalAccessToken:
        valueFrom:
          secretKeyRef:
            name: aditya-gh-token
            key: GH_TOKEN
      repositories:
        - owner: adityathebe
          repo: '*'
