---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mission-control
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: mission-control
      # the `-0` prerelease suffix makes the range match beta/rc builds too
      version: '>=0.1.329-0'
      interval: 10m # re-resolve the range against the repo index
      sourceRef:
        kind: HelmRepository
        name: flanksource
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      ui:
        host: mission-control.${HOMELAB_DOMAIN}
      api:
        host: mission-control.${HOMELAB_DOMAIN}

    artifactConnection: connection://mc/artifactstore

    db:
      create: false
      secretKeyRef:
        name: incident-commander-postgres
        key: DB_URL

    resources:
      requests:
        cpu: 100m
        memory: 768Mi
      limits:
        cpu: 500m
        memory: 2Gi

    canary-checker:
      db:
        embedded:
          persist: false
        external:
          enabled: true
          create: false
          secretKeyRef:
            name: incident-commander-postgres
            key: DB_URL

    config-db:
      clickhouse:
        enabled: true
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          cpu: 500m
          memory: 3Gi
      db:
        embedded:
          persist: false
        external:
          enabled: true
          create: false
          secretKeyRef:
            name: incident-commander-postgres
            key: DB_URL

    ingress:
      enabled: false

    llmConnection: connection://mc/openai

    flanksource-ui:
      oryKratosURL: https://mission-control.${HOMELAB_DOMAIN}/api/.ory
      ingress:
        enabled: false

    kratos:
      deployment:
        extraEnv:
          - name: DSN
            valueFrom:
              secretKeyRef:
                name: incident-commander-postgres
                key: DB_URL

    mission-control-kubernetes-view:
      views:
        namespace:
          ingress:
            enabled: false

        ingress:
          enabled: false
