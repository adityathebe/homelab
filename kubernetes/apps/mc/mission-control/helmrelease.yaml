---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mission-control
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: mission-control
      version: 0.1.328
      sourceRef:
        kind: HelmRepository
        name: flanksource
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      ui:
        host: mission-control.${HOMELAB_DOMAIN}
      api:
        host: mission-control.${HOMELAB_DOMAIN}

    db:
      create: true
      storageClass: longhorn
      storage: 20Gi

    config-db:
      db:
        embedded:
          persist: false
        external:
          enabled: true
          create: false
          secretKeyRef:
            name: incident-commander-postgres
            key: DB_URL

    ingress:
      enabled: false

    flanksource-ui:
      oryKratosURL: https://mission-control.${HOMELAB_DOMAIN}/api/.ory
      ingress:
        enabled: false
