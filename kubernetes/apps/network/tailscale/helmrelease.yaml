---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: network
spec:
  interval: 30m
  chart:
    spec:
      chart: tailscale-operator
      version: 1.102.2
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
      interval: 5m
  values:
    operatorConfig:
      hostname: tailscale-operator
      defaultTags:
        - tag:k8s
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      extraEnv:
        - name: XDG_CONFIG_HOME
          value: /tmp
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
    apiServerProxyConfig:
      mode: 'true'
  valuesFrom:
    - kind: Secret
      name: tailscale-operator
      valuesKey: OAUTH_CLIENT_ID
      targetPath: oauth.clientId
    - kind: Secret
      name: tailscale-operator
      valuesKey: OAUTH_CLIENT_SECRET
      targetPath: oauth.clientSecret
