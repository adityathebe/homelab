# Amp orbs reach the API server through the Tailscale operator's auth proxy,
# which impersonates each orb with the group of its tag, tag:amp-orb.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: amp-orb-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: tag:amp-orb
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: amp-orb-pod-deleter
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: amp-orb-pod-deleter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: amp-orb-pod-deleter
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: tag:amp-orb
