apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-run-as-nonroot
  annotations:
    policies.kyverno.io/title: Require runAsNonRoot
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers must be required to run as non-root users. This policy ensures
      `runAsNonRoot` is set to `true`.
spec:
  validationActions: [Deny]
  # Pod-only, like the legacy ClusterPolicies: name exclusions don't apply to pod templates.
  autogen:
    podControllers:
      enabled: false
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: exclude
      expression: >-
        !(
          (object.metadata.namespace == 'storage' && (
            ['csi-attacher', 'csi-provisioner', 'csi-resizer', 'csi-snapshotter', 'engine-image-', 'instance-manager-',
             'longhorn-', 'share-manager-'].exists(p, object.metadata.name.startsWith(p)) ||
            'longhorn.io/managed-by' in object.metadata.?labels.orValue({}))) ||
          (object.metadata.namespace == 'metallb-system' && object.metadata.name.startsWith('speaker')) ||
          (object.metadata.namespace == 'kube-system' &&
            ['coredns', 'kube-vip', 'intel-gpu-resource-driver-kubelet-plugin'].exists(p, object.metadata.name.startsWith(p))) ||
          (object.metadata.namespace == 'monitoring' && object.metadata.name.startsWith('victoria-logs-collector')) ||
          (object.metadata.namespace == 'network' &&
            ['csi-smb-controller', 'csi-smb-node', 'ts-subnet-router-'].exists(p, object.metadata.name.startsWith(p)))
        )
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(c,
          c.?securityContext.?runAsNonRoot.orValue(object.spec.?securityContext.?runAsNonRoot.orValue(false)) == true)
      message: >-
        Running as root is not allowed. Either the field spec.securityContext.runAsNonRoot
        must be set to `true`, or the fields spec.containers[*].securityContext.runAsNonRoot,
        spec.initContainers[*].securityContext.runAsNonRoot, and spec.ephemeralContainers[*].securityContext.runAsNonRoot
        must be set to `true`.
