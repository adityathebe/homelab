apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: drop-all-capabilities
  annotations:
    policies.kyverno.io/title: Drop All Capabilities
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Capabilities permit privileged actions without giving full root access. All
      capabilities should be dropped from a Pod, with only those required added back.
      This policy ensures that all containers explicitly specify the `drop: ["ALL"]`
      ability, in any case.
spec:
  validationActions: [Deny]
  # Pod-only, like the legacy ClusterPolicies: name exclusions don't apply to pod templates.
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: exclude
      expression: >-
        !(
          (object.metadata.namespace == 'storage' && (
            ['csi-attacher', 'csi-provisioner', 'csi-resizer', 'csi-snapshotter', 'engine-image-', 'instance-manager-',
             'longhorn-csi-plugin', 'longhorn-manager', 'share-manager-'].exists(p, object.metadata.name.startsWith(p)) ||
            'longhorn.io/managed-by' in object.metadata.?labels.orValue({}))) ||
          (object.metadata.namespace == 'kube-system' &&
            ['kube-vip', 'metrics-server'].exists(p, object.metadata.name.startsWith(p))) ||
          (object.metadata.namespace == 'network' && object.metadata.name.startsWith('ts-subnet-router-'))
        )
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(c,
          c.?securityContext.?capabilities.?drop.orValue([]).exists(cap, cap.upperAscii() == 'ALL'))
      message: Containers must drop `ALL` capabilities.
