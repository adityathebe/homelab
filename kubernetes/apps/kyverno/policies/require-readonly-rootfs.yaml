apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-readonly-rootfs
  annotations:
    policies.kyverno.io/title: Require Read-Only Root Filesystem
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      A read-only root filesystem helps to enforce an immutable infrastructure strategy.
      The container should only need to write to mounted volumes that can persist state even
      if the container exits. This policy ensures that containers specify
      readOnlyRootFilesystem: true.
spec:
  validationActions: [Deny]
  # Pod-only, like the legacy ClusterPolicies: name exclusions don't apply to pod templates.
  autogen:
    podControllers:
      enabled: false
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: exclude
      expression: >-
        !(
          object.metadata.namespace == 'storage' ||
          (object.metadata.namespace == 'forgejo' &&
            object.metadata.?labels.orValue({})[?'app.kubernetes.io/name'].orValue('') == 'forgejo') ||
          (object.metadata.namespace == 'immich' &&
            ['immich-server', 'immich-valkey'].exists(p, object.metadata.name.startsWith(p))) ||
          (object.metadata.namespace == 'kube-system' && object.metadata.name.startsWith('kube-vip')) ||
          (object.metadata.namespace == 'mc' &&
            ['canary-checker', 'config-db', 'incident-manager-ui', 'mission-control', 'postgrest-mission-control'].exists(p, object.metadata.name.startsWith(p))) ||
          (object.metadata.namespace == 'network' &&
            ['csi-smb-controller', 'csi-smb-node', 'envoy-external', 'envoy-gateway', 'envoy-internal', 'external-dns',
             'operator', 'ts-subnet-router'].exists(p, object.metadata.name.startsWith(p)))
        )
  validations:
    - expression: >-
        object.spec.containers.all(c, c.?securityContext.?readOnlyRootFilesystem.orValue(false) == true)
      message: >-
        Containers must use a read-only root filesystem. Set
        spec.containers[*].securityContext.readOnlyRootFilesystem to `true`.
