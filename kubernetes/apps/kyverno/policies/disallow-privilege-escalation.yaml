apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privilege-escalation
  annotations:
    policies.kyverno.io/title: Disallow Privilege Escalation
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Privilege escalation, such as via set-user-ID or set-group-ID file mode, should not be allowed.
      This policy ensures the `allowPrivilegeEscalation` field is set to `false`.
spec:
  validationActions: [Deny]
  # Pod-only, like the legacy ClusterPolicies: name exclusions don't apply to pod templates.
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: exclude
      expression: >-
        !(
          (object.metadata.namespace == 'storage' && (
            ['csi-attacher', 'csi-provisioner', 'csi-resizer', 'csi-snapshotter', 'engine-image-', 'instance-manager-',
             'longhorn-csi-plugin', 'longhorn-manager', 'share-manager-'].exists(p, object.metadata.name.startsWith(p)) ||
            'longhorn.io/managed-by' in object.metadata.?labels.orValue({}))) ||
          (object.metadata.namespace == 'kube-system' &&
            ['kube-vip', 'intel-gpu-resource-driver-kubelet-plugin'].exists(p, object.metadata.name.startsWith(p))) ||
          (object.metadata.namespace == 'network' &&
            ['csi-smb-controller', 'csi-smb-node', 'ts-subnet-router-'].exists(p, object.metadata.name.startsWith(p)))
        )
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(c, c.?securityContext.?allowPrivilegeEscalation.orValue(true) == false)
      message: >-
        Privilege escalation is disallowed. The fields
        spec.containers[*].securityContext.allowPrivilegeEscalation,
        spec.initContainers[*].securityContext.allowPrivilegeEscalation,
        and spec.ephemeralContainers[*].securityContext.allowPrivilegeEscalation
        must be set to `false`.
