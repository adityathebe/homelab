apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/title: Disallow Privileged Containers
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    kyverno.io/kyverno-version: 1.6.0
    kyverno.io/kubernetes-version: "1.22-1.23"
    policies.kyverno.io/description: >-
      Privileged mode disables most security mechanisms and must not be allowed. This policy
      ensures Pods do not call for privileged mode.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: privileged-containers
      match:
        any:
        - resources:
            kinds:
              - Pod
      exclude:
        any:
        - resources:
            namespaces:
              - storage
            names:
              - engine-image-*
              - instance-manager-*
              - longhorn-csi-plugin*
              - longhorn-manager*
              - share-manager-*
        - resources:
            namespaces:
              - kube-system
            names:
              - intel-gpu-resource-driver-kubelet-plugin*
        - resources:
            namespaces:
              - network
            names:
              - csi-smb-controller*
              - csi-smb-node*
              - ts-subnet-router-*
      validate:
        message: >-
          Privileged mode is disallowed. The fields spec.containers[*].securityContext.privileged,
          spec.initContainers[*].securityContext.privileged, and spec.ephemeralContainers[*].securityContext.privileged must be unset or set to `false`.
        foreach:
          - list: request.object.spec.[ephemeralContainers, initContainers, containers][]
            preconditions:
              all:
                - key: >-
                    {{ request.object.metadata.namespace == 'forgejo' &&
                    request.object.spec.serviceAccountName == 'forgejo-runner-docker-task' &&
                    request.object.spec.automountServiceAccountToken == `false` &&
                    contains(request.object.spec.initContainers[].name || `[]`, element.name) &&
                    element.name == 'dind' && element.image == 'docker:29-dind' &&
                    element.restartPolicy == 'Always' }}
                  operator: NotEquals
                  value: true
            pattern:
              =(securityContext):
                =(privileged): "false"
