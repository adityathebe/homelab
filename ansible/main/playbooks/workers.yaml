---
- hosts: workers
  become: true

  tasks:
    - name: install nfs-common for longhorn nfs backup # https://longhorn.io/docs/1.9.1/deploy/install/#installing-nfsv4-client
      apt:
        name: nfs-common
        update_cache: yes
        state: present

    - name: install open-iscsi for longhorn
      apt:
        name: open-iscsi
        update_cache: yes
        state: present

    - name: enable and start iscsid service
      systemd:
        name: iscsid
        enabled: yes
        state: started

    # systemd >= 258 (ubuntu 26.04) no longer reads /etc/sysctl.conf, which is
    # the ansible sysctl module's default target. write to a sysctl.d drop-in
    # instead — read by every systemd version, and 99- sorts last so it wins.
    - name: 'increase inotify user watches'
      sysctl:
        name: fs.inotify.max_user_watches
        value: 524288
        state: present
        sysctl_file: /etc/sysctl.d/99-k8s.conf

    - name: 'increase inotify user instances'
      sysctl:
        name: fs.inotify.max_user_instances
        value: 524288
        state: present
        sysctl_file: /etc/sysctl.d/99-k8s.conf

    - name: 'increase inotify queued events'
      sysctl:
        name: fs.inotify.max_queued_events
        value: 2099999999
        state: present
        sysctl_file: /etc/sysctl.d/99-k8s.conf

    - name: 'disable multipath service (conflicts with longhorn)'
      systemd:
        name: multipathd
        state: stopped
        enabled: false
      ignore_errors: true

    - name: 'disable multipath socket (conflicts with longhorn)'
      systemd:
        name: multipathd.socket
        state: stopped
        enabled: false
      ignore_errors: true
